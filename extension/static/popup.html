<!doctype html><html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chrysalis</title><link rel="stylesheet" href="styles.css"><script type="module" src="page.js"></script></head>
<body class="popup"><header class="brand"><img src="assets/logo.png" width="38" height="38" alt=""><span>Chrysalis</span><span class="edition">Early preview</span></header>
<section id="introduction" hidden></section><main id="experience" hidden><h1 class="popup-title">Your YouTube session</h1><section id="session-root" aria-label="Session planning and controls"></section>
<p id="history-storage-summary" class="note" role="status">Session activity stays in browser memory by default; restarting Chrome clears it.</p>
<nav class="popup-links" aria-label="Chrysalis pages"><button id="open-history" class="text-button">Session history</button>
<button id="viewing-preferences" class="text-button">Viewing preferences</button></nav>
<section class="controls extension-pause-controls" aria-label="Pause controls"><button id="extension-pause" class="secondary" disabled>Pause Chrysalis</button><p id="extension-pause-description" class="note">Pause timing and restore YouTube’s ordinary layout. Your choices stay saved.</p></section><details class="controls quick-preferences"><summary>Appearance &amp; indicator</summary><label class="toggle-row" for="show-indicator"><span><strong>Show session indicator</strong><small>Your intention is visible on YouTube when expanded.</small></span><input type="checkbox" id="show-indicator" disabled></label><div class="select-row"><label for="theme">Appearance</label><select id="theme" disabled><option value="system">Use device setting</option><option value="light">Light</option><option value="dark">Dark</option></select></div></details>
<p id="save-status" class="status" role="status">Loading settings…</p><button id="retry" class="text-button" hidden>Try again</button><button id="open-settings" class="secondary full-width">Open settings <span aria-hidden="true">↗</span></button>
</main><footer><span id="connection" role="status">Connecting…</span><span>Stored locally</span></footer></body></html>
